# ── Sistema base ──────────────────────────────────────────────────────────────
CHOST="x86_64-pc-linux-gnu"

# ── Compilador principal: Clang/LLVM ──────────────────────────────────────────
CC="clang"
CXX="clang++"
AR="llvm-ar"
NM="llvm-nm"
CPP="clang-cpp"
RANLIB="llvm-ranlib"
CLANG_FLAGS="-rtlib=compiler-rt -unwindlib=libunwind"
LDFLAGS="-fuse-ld=lld ${CLANG_FLAGS} -Wl,--as-needed"

# ── Otimização ────────────────────────────────────────────────────────────────
CFLAGS="-march=znver2 -O2 -pipe"
CXXFLAGS="${CFLAGS}"
FCFLAGS="${CFLAGS}"
FFLAGS="${CFLAGS}"

# ── Paralelismo ───────────────────────────────────────────────────────────────
MAKEOPTS="-j16 -l16"

# ── Hardware ──────────────────────────────────────────────────────────────────
VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput"
LLVM_TARGETS="AMDGPU X86"

# ── USE flags globais ─────────────────────────────────────────────────────────
USE="
  wayland -X
  pipewire -pulseaudio
  vulkan opengl screencast
  systemd dbus
  nls unicode
  libinput declarative
  -bluetooth
  -cups
  -gnome -gtk4 -gtk
  -doc -examples -test -debug -ppd
"

# ── Localização ───────────────────────────────────────────────────────────────
L10N="pt-BR"

# ── Licenças ──────────────────────────────────────────────────────────────────
ACCEPT_LICENSE="*"

# ── Keywords: ~amd64 = unstable/rolling release ───────────────────────────────
ACCEPT_KEYWORDS="~amd64"

# ── Editor ────────────────────────────────────────────────────────────────────
EDITOR="micro"

# ── Mirrors ───────────────────────────────────────────────────────────────────
GENTOO_MIRRORS="https://gentoo.c3sl.ufpr.br http://gentoo.c3sl.ufpr.br"

# ── GRUB ──────────────────────────────────────────────────────────────────────
GRUB_PLATFORMS="efi-64"

# ── Portage: diretórios ───────────────────────────────────────────────────────
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/var/tmp/portage"
CCACHE_DIR="/var/cache/ccache"

# ── Portage: comportamento ────────────────────────────────────────────────────
PORTAGE_NICENESS="19"
AUTOCLEAN="yes"
CLEAN_DELAY=0

# ── Portage: saída silenciosa ─────────────────────────────────────────────────
# Use 'elogv' (app-portage/elogv) para revisar quando quiser
PORTAGE_ELOG_CLASSES="warn error"
PORTAGE_ELOG_SYSTEM="save"

# ── Portage: features ─────────────────────────────────────────────────────────
FEATURES="fixlafiles unmerge-orphans parallel-fetch parallel-install ccache"

# ── emerge: opções padrão ─────────────────────────────────────────────────────
EMERGE_DEFAULT_OPTS="
  --quiet
  --ask
  --jobs 16
  --load-average 16
  --autounmask y
  --autounmask-write y
  --with-bdeps y
  --quiet-build y
  --keep-going y
  --verbose-conflicts
"
