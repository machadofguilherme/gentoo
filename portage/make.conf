# ──────────────────────────────────────────────────────────────────────────────
# Sistema
# ──────────────────────────────────────────────────────────────────────────────

CHOST="x86_64-pc-linux-gnu"

# ──────────────────────────────────────────────────────────────────────────────
# Compilador principal: Clang/LLVM
# ──────────────────────────────────────────────────────────────────────────────

#CC="clang"
#CXX="clang++"
#AR="llvm-ar"
#NM="llvm-nm"
#CPP="clang-cpp"
#RANLIB="llvm-ranlib"
#CLANG_FLAGS="-rtlib=compiler-rt -unwindlib=libunwind"
#LDFLAGS="-fuse-ld=lld ${CLANG_FLAGS} -Wl,--as-needed"

# ──────────────────────────────────────────────────────────────────────────────
# Otimização
# ──────────────────────────────────────────────────────────────────────────────

CFLAGS="-march=znver2 -O3 -pipe"
CXXFLAGS="${CFLAGS}"
FCFLAGS="${CFLAGS}"
FFLAGS="${CFLAGS}"

# ──────────────────────────────────────────────────────────────────────────────
# Paralelismo
# ──────────────────────────────────────────────────────────────────────────────

MAKEOPTS="-j16 -l16"

# ──────────────────────────────────────────────────────────────────────────────
# Hardware
# ──────────────────────────────────────────────────────────────────────────────

VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput"

LLVM_TARGETS="AMDGPU X86"

# ──────────────────────────────────────────────────────────────────────────────
# USE flags
# ──────────────────────────────────────────────────────────────────────────────

USE="
  plasma
  qt6
  wayland
  pipewire
  vulkan
  opengl
  nls
  unicode
  -bluetooth
  -cups
  -doc
  -examples
  -test
  -debug
  -ppd
  -gnome
  -gtk4
  -gtk
  -X
"

# ──────────────────────────────────────────────────────────────────────────────
# Localização
# ──────────────────────────────────────────────────────────────────────────────

L10N="pt-BR"

# ──────────────────────────────────────────────────────────────────────────────
# Licenças
# ──────────────────────────────────────────────────────────────────────────────

ACCEPT_LICENSE="*"

# ──────────────────────────────────────────────────────────────────────────────
# Keywords
# ──────────────────────────────────────────────────────────────────────────────

ACCEPT_KEYWORDS="~amd64"

# ──────────────────────────────────────────────────────────────────────────────
# Editor
# ──────────────────────────────────────────────────────────────────────────────

EDITOR="micro"

# ──────────────────────────────────────────────────────────────────────────────
# Mirrors
# ──────────────────────────────────────────────────────────────────────────────

GENTOO_MIRRORS="https://gentoo.c3sl.ufpr.br https://mirror.init7.net/gentoo"

# ──────────────────────────────────────────────────────────────────────────────
# GRUB
# ──────────────────────────────────────────────────────────────────────────────

GRUB_PLATFORMS="efi-64"

# ──────────────────────────────────────────────────────────────────────────────
# Portage
# ──────────────────────────────────────────────────────────────────────────────

DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"
PORTAGE_TMPDIR="/var/tmp/portage"
CCACHE_DIR="/var/cache/ccache"

PORTAGE_NICENESS="19"

AUTOCLEAN="yes"
CLEAN_DELAY=0

# ──────────────────────────────────────────────────────────────────────────────
# Logs
# ──────────────────────────────────────────────────────────────────────────────

PORTAGE_ELOG_CLASSES="warn error"
PORTAGE_ELOG_SYSTEM="save"

# ──────────────────────────────────────────────────────────────────────────────
# Features
# ──────────────────────────────────────────────────────────────────────────────

FEATURES="
  fixlafiles
  unmerge-orphans
  parallel-fetch
  parallel-install
  ccache
"

# ──────────────────────────────────────────────────────────────────────────────
# Emerge
# ──────────────────────────────────────────────────────────────────────────────

EMERGE_DEFAULT_OPTS="
  --quiet
  --ask
  --jobs 16
  --load-average 16
  --autounmask y
  --autounmask-write y
  --with-bdeps y
  --quiet-build y
  --keep-going y
  --verbose-conflicts
"
